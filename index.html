<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>有機化合物ビンゴ</title><link rel="icon" href="data:,"><link rel="stylesheet" href="style.css?v=20261030-8"></head><body>
<header><div class="toolbar"><button id="settings" disabled>設定</button><button id="choose-set" disabled>ビンゴセットを選択</button><strong id="set-name"></strong></div><div class="toolbar"><button id="name-mode" disabled aria-pressed="true">化合物名</button><button id="structure-mode" disabled aria-pressed="false">構造式</button><button id="audio-resume" hidden>音声を再開</button><button id="fullscreen">全画面</button><button id="reset" disabled>リセット</button></div></header>
<main><button id="display" disabled class="display"><span id="value">読み込み中…</span><span id="progress"></span></button><div id="message" role="status"></div><section class="history" aria-label="履歴"><ul id="history"></ul></section></main>
<dialog id="selector"><h2>ビンゴセットを選択</h2><div id="choices" class="stack"></div><button data-close="selector">閉じる</button></dialog>
<dialog id="settings-dialog" class="settings"><div class="toolbar"><h2>設定</h2><button data-close="settings-dialog">閉じる</button></div><div class="toolbar"><button id="set-tab">ビンゴセット</button><button id="master-tab">マスターデータ</button><strong id="dirty" role="status"></strong></div><div class="toolbar"><button id="load-edit">編集を開始 / 最新データを読み直す</button><button id="discard">未反映の変更を破棄</button><button id="save">GitHubへ反映</button><button id="check-save" hidden>保存結果を確認</button></div><p id="edit-status" role="status"></p>
<section id="set-panel"><div class="toolbar"><div id="edit-set" class="set-choices" aria-label="編集するビンゴセット"></div><button id="new-set">新規作成</button><button id="copy-set">複製</button><button id="rename-set">名前変更</button><button id="delete-set">削除</button><button id="add">化合物を追加</button><button id="print-set">ビンゴセットを印刷</button></div><p id="counts"></p><div id="set-filters"></div><div class="toolbar"><button id="all-on">表示中をすべてON</button><button id="all-off">表示中をすべてOFF</button></div><div class="table-wrap"><table><thead><tr><th>No.</th><th>表示</th><th>化合物名</th><th>官能基・構造の分類</th><th>骨格分類</th><th>タグ</th><th>構造式</th><th>削除</th></tr></thead><tbody id="set-rows"></tbody></table></div></section>
<section id="master-panel" hidden><div class="toolbar"><h3>マスターデータ</h3><button id="print-master">マスターデータを印刷</button></div><p class="muted">化合物の新規登録・削除・構造式編集はCodexで行います</p><div id="master-filters"></div><div class="master-workspace"><div class="table-wrap master-list"><table><thead><tr><th>化合物名 / ID</th><th>分子式</th><th>構造式</th></tr></thead><tbody id="master-rows"></tbody></table></div><section id="compound-editor" aria-label="化合物の詳細"></section></div></section></dialog>
<dialog id="add-dialog"><h2>化合物を追加</h2><div id="add-filters"></div><div id="add-list" class="stack"></div><div class="toolbar"><button id="add-selected">このセットに追加</button><button data-close="add-dialog">キャンセル</button></div></dialog>
<dialog id="save-dialog"><h2>GitHubへ反映</h2><pre id="diff"></pre><label>GitHubトークン <input id="token" type="password" autocomplete="off"></label><div class="toolbar"><button id="save-confirm">GitHubへ反映</button><button id="save-cancel">キャンセル</button></div></dialog>
<script src="core.js?v=20261029-3"></script><script src="validation.js?v=20261029-3"></script><script src="github.js?v=20261029-3"></script><script src="audio.js?v=20261030-4"></script><script src="print.js?v=20261030-8"></script><script src="app.js?v=20261030-8"></script></body></html>
